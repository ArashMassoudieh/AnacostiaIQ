<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnacostiaIQ — System Health</title>
<style>
:root{color-scheme:dark;--bg:#15181d;--panel:#20242b;--border:#313741;--text:#e5e9ef;--muted:#8b98a7;--ok:#2ecc71;--deg:#f5a623;--off:#e74c3c;--crit:#ff1744}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:22px}.sub,.seen,.reason{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px}button,a.btn{background:#0d6efd;color:#fff;border:0;border-radius:7px;padding:9px 13px;text-decoration:none;font-weight:600;cursor:pointer}.secondary{background:#2c323b!important}main{padding:18px;max-width:1500px;margin:auto}.station{margin-bottom:28px}.station h2{margin:0 0 4px}.summary,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}.card h3{margin:0 0 8px;font-size:13px;color:#b7c0ca}.big{font-size:24px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px}.pill{border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;text-transform:uppercase}.healthy{color:#6ee7a2}.degraded{color:#ffc766}.offline{color:#ff8f8f}.critical{color:#ff7a97}.unknown{color:#a9bac7}.alarm{border-left:4px solid var(--off)}.alarms{margin-top:12px}.empty{color:var(--muted);font-style:italic}.api-ok{color:#6ee7a2}.api-bad{color:#ff8f8f}
</style></head><body>
<header><div><h1>AnacostiaIQ System Health</h1><div class="sub">Station-scoped sensor, application, cloud, queue, storage and CPU health</div></div><div class="toolbar"><a class="btn secondary" href="/SensorDashboard.html">Charts</a><button id="notifyBtn" class="secondary">Enable browser alerts</button><button id="refreshBtn">Refresh now</button></div></header>
<main><div class="summary"><div class="card"><h3>API CONNECTION</h3><div id="apiState" class="big">CHECKING</div><div id="apiDetail" class="seen"></div></div><div class="card"><h3>LAST PORTAL REFRESH</h3><div id="lastRefresh" class="big">--</div><div class="seen">Auto-refresh every 15 s</div></div></div><div id="stations"></div></main>
<script>
const COMPONENTS=[['sensor_hcsr04_depth','Inflow Weir Head'],['sensor_maxbotix_depth','Ponding Depth'],['sensor_moisture_sensor','Soil Moisture'],['application','Application'],['cloud','Cloud / API'],['upload_queue','Upload Queue'],['storage','Storage'],['cpu_temperature','CPU Temperature'],['overall','Overall Station']];
let apiBase='http://54.213.147.59:5000',stations=[],applicationStaleSeconds=600;let previous={};
const stateName=v=>['healthy','degraded','offline','critical'][Number(v)]||'unknown';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function latestReading(p){const a=Array.isArray(p)?p:(p&&Array.isArray(p.readings)?p.readings:[]);return a.map(x=>({value:Number(x.value),timestamp:x.timestamp||x.time||x.datetime||x.date,reason:x.reason||x.unit||''})).filter(x=>Number.isFinite(x.value)&&x.timestamp).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp))[0]||null}
async function loadConfig(){try{const r=await fetch('/config.json',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j.api_url)apiBase=j.api_url.replace(/\/$/,'');stations=Array.isArray(j.health_stations)?j.health_stations:[];applicationStaleSeconds=Math.max(60,Number(j.health_application_stale_seconds)||600)}catch(e){}if(!stations.length)stations=[{id:'field_station_01',name:'CUA Field Station'}]}
async function fetchHealth(station,id){const end=new Date(),start=new Date(end-24*3600e3),u=new URL(apiBase+'/sensor/health_'+station+'_'+id);u.searchParams.set('start',start.toISOString());u.searchParams.set('end',end.toISOString());const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return latestReading(await r.json())}
function notifyTransition(key,label,state){const old=previous[key];if(old===undefined){previous[key]=state;return}if(old===state)return;previous[key]=state;if(Notification.permission!=='granted')return;new Notification(state==='healthy'?'AnacostiaIQ recovered':'AnacostiaIQ alarm',{body:label+(state==='healthy'?' returned to healthy.':' is '+state.toUpperCase()+'.')})}
function card(label,state,reason,ts){return `<div class="card ${(state==='offline'||state==='critical')?'alarm':''}"><div class="row"><h3>${esc(label)}</h3><span class="pill ${state}">${esc(state)}</span></div><div class="reason">${esc(reason)}</div><div class="seen">Last seen: ${ts?new Date(ts).toLocaleString():'never'}</div></div>`}
async function refresh(){let apiOk=true,apiErr='';const host=document.getElementById('stations');host.innerHTML='';for(const s of stations.filter(s=>s.visible!==false)){const section=document.createElement('section');section.className='station';section.innerHTML=`<h2>${esc(s.name||s.id)}</h2><div class="sub">${esc(s.location||s.id)}</div><div class="grid"></div><div class="alarms"><h3>Active alarms</h3><div class="alarmList empty">No active alarms.</div></div>`;host.appendChild(section);const grid=section.querySelector('.grid'),alarmList=section.querySelector('.alarmList'),active=[];const results=await Promise.all(COMPONENTS.map(async([id,label])=>{try{return{id,label,r:await fetchHealth(s.id,id)}}catch(e){apiOk=false;apiErr=e.message;return{id,label,r:null}}}));for(const x of results){let state=x.r?stateName(x.r.value):'unknown',ts=x.r?.timestamp||null,reason=x.r?.reason||('health_'+s.id+'_'+x.id);if(reason==='state')reason='health state code '+(x.r?.value??'unknown');if(x.id==='application'){const age=ts?(Date.now()-new Date(ts))/1000:Infinity;if(age>applicationStaleSeconds){state='offline';reason='missing/stale application heartbeat'}}grid.insertAdjacentHTML('beforeend',card(x.label,state,reason,ts));notifyTransition(s.id+'_'+x.id,(s.name||s.id)+' — '+x.label,state);if(['degraded','offline','critical'].includes(state))active.push({label:x.label,state,reason,ts})}alarmList.className='alarmList '+(active.length?'':'empty');alarmList.innerHTML=active.length?active.map(a=>card(a.label,a.state,a.reason,a.ts)).join(''):'No active alarms.'}const api=document.getElementById('apiState');api.textContent=apiOk?'REACHABLE':'UNREACHABLE';api.className='big '+(apiOk?'api-ok':'api-bad');document.getElementById('apiDetail').textContent=apiOk?apiBase:(apiErr||'Request failed');document.getElementById('lastRefresh').textContent=new Date().toLocaleTimeString()}
document.getElementById('notifyBtn').onclick=async()=>{if(!('Notification'in window))return alert('Browser notifications are not supported here.');await Notification.requestPermission()};document.getElementById('refreshBtn').onclick=refresh;(async()=>{await loadConfig();await refresh();setInterval(refresh,15000)})();
</script></body></html>
